name: Refresh learning timeline

on:
  schedule:
    - cron: "20 */4 * * *" # every 4 hours — warms Vercel ISR
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /learning so stale ISR regenerates
        run: |
          curl -fsS -A "github-actions-learning-refresh" \
            "https://krajasekharreddy.com/learning" \
            -o /dev/null -w "HTTP %{http_code}\n"
