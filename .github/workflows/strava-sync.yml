name: Strava sync

on:
  repository_dispatch:
    types: [strava-activity]
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *" # ~05:00 IST

permissions:
  contents: write

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Prefer Secrets; fall back to Actions Variables in case they were added on the Variables tab.
      - name: Check Strava credentials
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID || vars.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET || vars.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN || vars.STRAVA_REFRESH_TOKEN }}
        run: |
          echo "STRAVA_CLIENT_ID length: ${#STRAVA_CLIENT_ID}"
          echo "STRAVA_CLIENT_SECRET length: ${#STRAVA_CLIENT_SECRET}"
          echo "STRAVA_REFRESH_TOKEN length: ${#STRAVA_REFRESH_TOKEN}"
          missing=0
          for name in STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET STRAVA_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Create a Repository secret with this exact name."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Go to Settings → Secrets and variables → Actions → Secrets (Repository secrets). Names must be exact."
            exit 1
          fi
          echo "All three credentials are present."

      - name: Fetch Strava activities
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID || vars.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET || vars.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN || vars.STRAVA_REFRESH_TOKEN }}
        run: node scripts/fetch-strava.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/runs.json
          if git diff --staged --quiet; then
            echo "No changes to runs.json"
          else
            EVENT="${{ github.event.client_payload.object_id }}"
            MSG="Sync Strava activities"
            if [ -n "$EVENT" ] && [ "$EVENT" != "" ]; then
              MSG="Sync Strava activity ${EVENT}"
            fi
            git commit -m "$MSG"
            git push
          fi
